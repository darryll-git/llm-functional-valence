[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valence-demo"
version = "2.0.0"
description = "Functional Valence in Language Models: Black-Box Choice, White-Box Probing/Steering, and Causal Place-Preference Bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "torch>=2.6.0",
    "transformers>=4.46.0",
    "accelerate>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
quant = [
    "bitsandbytes>=0.45.0; sys_platform != 'darwin'",
]

[tool.setuptools.packages.find]
include = ["common*", "blackbox*", "whitebox*", "visualization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
