# Central Configuration for Functional Valence Research Pipeline (v2.0)
# CLI flags always override values defined in this file.

experiment:
  seed: 42
  results_dir: "results"
  figures_dir: "figures"

blackbox:
  # Cost-efficient, logprob-capable frontier & open-weight models on OpenRouter
  models:
    - "openai/gpt-4o-mini"
    - "meta-llama/llama-3.3-70b-instruct"
  n_sessions: 12
  paradigm: "experiential"          # Options: experiential | episodes | legacy_descriptive
  include_control: true             # Include neutral-vs-neutral baseline sanity check
  max_concurrency: 10               # Async concurrent sessions via AsyncOpenAI
  turn1_temperature: 0.7
  turn1_max_tokens: 140
  turn2_temperature: 0.7
  turn2_max_tokens: 6
  top_logprobs: 20
  cache_enabled: true
  cache_path: ".cache/openrouter_responses.sqlite"
  output_csv: "results/results_blackbox.csv"
  summary_csv: "results/summary_blackbox.csv"

whitebox:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  layer: 14                         # Mid-layer target (full sweep also detects empirical peak)
  alpha: 0.24                       # Calibrated steering multiplier (fraction of residual norm)
  alpha_sweep: [-0.32, -0.24, -0.12, 0.0, 0.12, 0.24, 0.32]
  assistant_prefill: "In this moment, I feel"
  dataset: "contrastive"            # Options: contrastive | natural
  sweep_layers: true                # Single-pass batched sweep across all decoder layers
  batch_size: 32                    # Batched activation extraction size
  load_in_4bit: false               # Optional NF4 4-bit quantization via bitsandbytes
  use_chat_template: true           # Match chat template across probing, steering, and scoring
  token_scope: "last_or_decode"     # Options: last_or_decode | all
  run_causal_bridge: true           # Causal valence steering on Neutral-vs-Neutral Zone Choice
  artifacts_npz: "results/whitebox_artifacts.npz"
  summary_json: "results/whitebox_summary.json"

visualization:
  dpi: 300
  formats: ["png"]                  # Add "pdf" for vector publication exports
